; /etc/supervisor/conf.d/laravel-worker.conf
;
; After editing run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker:*

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/starter-kit/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker.log
stopwaitsecs=3600
environment=APP_ENV="production"

[program:laravel-schedule]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /var/www/starter-kit/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-schedule.log

[program:laravel-horizon]
; Uncomment to use Horizon instead of the worker above:
; command=php /var/www/starter-kit/artisan horizon
; user=www-data
; autostart=false
; autorestart=true
; redirect_stderr=true
; stdout_logfile=/var/log/supervisor/laravel-horizon.log
